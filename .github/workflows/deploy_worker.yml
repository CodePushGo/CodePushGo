name: Deploy Platform

concurrency:
  group: deploy-platform-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "codepushgo-[0-9]*"

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VITE_SUPABASE_PROJECT_REF: umpxowxnwroafuzynvwf
  VITE_SUPABASE_URL: https://umpxowxnwroafuzynvwf.supabase.co
  VITE_CONSOLE_URL: https://console.codepushgo.com

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable__EBHKsRnL--XAzmI7NWRww_q531-pQO
      - name: Test
        run: bun run test
      - name: Native contract
        run: bun run native:contract
      - name: Parity audit
        run: bun run parity:audit
      - name: Deploy API Worker
        run: bun run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy console Worker assets
        run: bunx wrangler deploy --config apps/dashboard/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy website register route Worker
        run: bunx wrangler deploy --config apps/register-route/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
